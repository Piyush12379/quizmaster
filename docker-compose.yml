version: "3.8"

services:
  # ─────────────────────────────────────────────
  # Microservice 3: MongoDB  (pulled from Docker Hub)
  # ─────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: quizmaster-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: quizmaster123
      MONGO_INITDB_DATABASE: quizmaster
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quizmaster-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Microservice 4: Mongo-Express  (pulled from Docker Hub)
  # ─────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: quizmaster-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: quizmaster123
      ME_CONFIG_MONGODB_URL: mongodb://admin:quizmaster123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - quizmaster-net

  # ─────────────────────────────────────────────
  # Microservice 2: Backend API  (built from Dockerfile)
  # ─────────────────────────────────────────────
  quiz-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quiz-api:latest
    container_name: quizmaster-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:quizmaster123@mongo:27017/quizmaster?authSource=admin
      NODE_ENV: production
    networks:
      - quizmaster-net

  # ─────────────────────────────────────────────
  # Microservice 1: Frontend UI  (built from Dockerfile)
  # ─────────────────────────────────────────────
  quiz-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quiz-ui:latest
    container_name: quizmaster-ui
    restart: unless-stopped
    depends_on:
      - quiz-api
    ports:
      - "3000:80"
    networks:
      - quizmaster-net

volumes:
  mongo_data:
    driver: local

networks:
  quizmaster-net:
    driver: bridge
